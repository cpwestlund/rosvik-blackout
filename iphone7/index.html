<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#09120d"><title>The Dark Quiet iPhone 7</title><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09120d;font-family:ui-monospace,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%}#boot{position:fixed;left:12px;top:12px;z-index:99;color:#fff;background:#8a5b19;border:1px solid #d9b566;padding:8px 10px;font:12px monospace}.joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:98px;height:98px;border:1px solid #ffffff33;border-radius:50%;background:#07100c88}.nub{position:absolute;left:31px;top:31px;width:36px;height:36px;border-radius:50%;background:#e7eee755;border:1px solid #ffffff44}.btn{position:fixed;border:1px solid #ffffff44;background:#08100ddd;color:#eef1ea;border-radius:18px;font:700 10px monospace}.act{right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:82px;height:66px}.bag{right:max(110px,calc(env(safe-area-inset-right) + 4px));bottom:max(20px,env(safe-area-inset-bottom));width:68px;height:48px}.light{right:max(22px,env(safe-area-inset-right));bottom:max(94px,calc(env(safe-area-inset-bottom) + 4px));width:58px;height:46px}.rotate{display:none;position:fixed;inset:0;z-index:120;background:#09120d;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}@media(orientation:portrait){.rotate{display:flex}}</style></head><body><canvas id="game"></canvas><div id="boot">HTML LADDAD • STARTAR…</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><button class="btn act" id="act">INTERAGERA</button><button class="btn bag" id="bag">VÄSKA</button><button class="btn light" id="light">LJUS</button><div class="rotate">Vrid iPhone till liggande läge</div><script>(function(){'use strict';const C=document.getElementById('game'),g=C.getContext('2d'),boot=document.getElementById('boot'),joy=document.getElementById('joy'),nub=document.getElementById('nub');let W=0,H=0,D=1,last=0,mv={x:0,y:0},bag=false,flash=true,msg='',inside=false;const p={x:0,y:3.4,step:0};function resize(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=Math.floor(W*D);C.height=Math.floor(H*D);C.style.width=W+'px';C.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function iso(x,y,z){z=z||0;return[W*.52+(x-y)*31,H*.49+(x+y)*15-z]}function P(a,c){g.fillStyle=c;g.beginPath();g.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)g.lineTo(a[i][0],a[i][1]);g.closePath();g.fill()}function tile(x,y,w,d,c){P([iso(x,y),iso(x+w,y),iso(x+w,y+d),iso(x,y+d)],c)}function box(x,y,w,d,h,top,front,side){const A=iso(x,y,h),B=iso(x+w,y,h),C0=iso(x+w,y+d,h),D0=iso(x,y+d,h),a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+d);P([a,b,B,A],front);P([b,c,C0,B],side);P([A,B,C0,D0],top)}function ground(){R(0,0,W,H,'#08110d');for(let x=-14;x<15;x+=2)for(let y=-10;y<11;y+=2)tile(x,y,2,2,((x+y)&2)?'#17361f':'#1d4226');tile(-14,-2.7,28,5.4,'#28312f');tile(-2.4,-10,4.8,20,'#232c2a');tile(-12,2.8,10,1.2,'#565951');tile(3.2,-3.8,9.4,1.2,'#565951');for(const a of[[-7,1.2,2,.5],[-1,.9,1.8,.5],[5,1.4,2.1,.6]]){tile(a[0],a[1],a[2],a[3],'#46666d66')}}function building(x,y,w,d,h,type,label){const gym=type==='gym';box(x,y,w,d,h,'#303534',gym?'#553027':'#57372d',gym?'#3e2722':'#402c25');for(let i=0;i<Math.floor(w/1.7);i++){let q=iso(x+.55+i*1.55,y+.03,h*.55);R(q[0]-10,q[1]-7,20,12,'#d2af61')}let e=iso(x+w*.48,y-.03,0);R(e[0]-11,e[1]-32,22,33,'#776a5b');let s=iso(x+w*.5,y+.3,h+12);g.font='bold 9px monospace';let tw=g.measureText(label).width+10;R(s[0]-tw/2,s[1]-10,tw,14,'#0a0d0ccc');g.fillStyle='#e1e4dc';g.fillText(label,s[0]-tw/2+5,s[1])}function lamp(x,y){let q=iso(x,y);R(q[0]-2,q[1]-50,4,50,'#313a35');g.fillStyle='#e0bd72';g.beginPath();g.arc(q[0],q[1]-54,6,0,Math.PI*2);g.fill();let z=g.createRadialGradient(q[0],q[1]-50,4,q[0],q[1]-50,55);z.addColorStop(0,'#ffd78144');z.addColorStop(1,'#ffd78100');g.fillStyle=z;g.fillRect(q[0]-60,q[1]-110,120,120)}function tree(x,y){let q=iso(x,y);R(q[0]-3,q[1]-28,6,30,'#58351f');R(q[0]-16,q[1]-48,30,20,'#2b4b27');R(q[0]-8,q[1]-58,24,19,'#3a6133')}function player(){let q=iso(p.x,p.y);g.fillStyle='#0008';g.beginPath();g.ellipse(q[0],q[1]+3,10,4,0,0,Math.PI*2);g.fill();R(q[0]-7,q[1]-18,14,26,'#315b52');R(q[0]-5,q[1]-30,10,12,'#b98e69');R(q[0]-6,q[1]-34,12,5,'#29231e');R(q[0]-7,q[1]+8,4,13,'#141817');R(q[0]+3,q[1]+8,4,13,'#141817')}function rain(){let t=performance.now()*.23;g.strokeStyle='#b8cfcc66';g.lineWidth=1;for(let i=0;i<72;i++){let x=(i*127+t)%W,y=(i*73+t*1.5)%H;g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+16);g.stroke()}}function hud(){R(12,12,154,122,'#06100de8');g.strokeStyle='#ffffff33';g.strokeRect(12,12,154,122);g.fillStyle='#eef1ea';g.font='11px monospace';const stats=[['HÄLSA',100,'#b35b57'],['HUNGER',72,'#c49f58'],['TÖRST',65,'#6b9bb1'],['VÄRME',78,'#b9ad87']];stats.forEach((a,i)=>{let y=31+i*23;g.fillStyle='#eef1ea';g.fillText(a[0],22,y);R(82,y-8,72,8,'#151b19');R(83,y-7,a[1]*.69,6,a[2])});g.fillStyle='#eef1ea';g.fillText(inside?'INNE • SKYDDAD':'UTE • 7°C • REGN',22,122);R(W-160,12,148,47,'#06100de8');g.fillStyle='#eef1ea';g.fillText('DAG 1   20:03',W-148,32);if(msg){R(W/2-120,H-44,240,24,'#06100def');g.fillStyle='#e4c773';g.textAlign='center';g.fillText(msg,W/2,H-28);g.textAlign='left'}if(bag){R(W*.23,H*.17,W*.54,H*.62,'#07100cef');g.strokeStyle='#ffffff33';g.strokeRect(W*.23,H*.17,W*.54,H*.62);g.fillStyle='#fff';g.font='bold 15px monospace';g.fillText('RYGGSÄCK',W*.26,H*.24);['Ficklampa','AA-batterier','Bandage','Vattenflaska'].forEach((s,i)=>{let x=W*.27+(i%2)*W*.24,y=H*.34+(i>>1)*62;R(x,y-20,W*.2,42,'#14201b');g.fillStyle='#dfe4da';g.font='10px monospace';g.fillText(s,x+8,y+5)})}}function say(s){msg=s;clearTimeout(say.t);say.t=setTimeout(()=>msg='',1400)}function scene(){ground();building(-11,-5.7,8.5,4,58,'school','ROSVIKSSKOLAN');building(3.5,-5.7,8,4.3,64,'gym','IDROTTSHALL');for(const a of[[-11,4],[-8,4.4],[-4,5],[4,5],[9,4.7],[12,3]])tree(a[0],a[1]);for(const a of[[-6,.5],[-1,.2],[4,.4],[9,.8]])lamp(a[0],a[1]);player();rain();if(flash){let q=iso(p.x,p.y),z=g.createRadialGradient(q[0]+40,q[1],3,q[0]+40,q[1],130);z.addColorStop(0,'#ffe5a044');z.addColorStop(1,'#ffe5a000');g.globalCompositeOperation='screen';g.fillStyle=z;g.fillRect(q[0]-10,q[1]-120,180,220);g.globalCompositeOperation='source-over'}R(0,0,W,H,'#03100a22');hud()}function loop(t){try{let dt=Math.min(.033,(t-last)/1000||0);last=t;if(!bag){p.x+=mv.x*dt*2.0;p.y+=mv.y*dt*2.0;p.x=Math.max(-10,Math.min(10,p.x));p.y=Math.max(-4,Math.min(7,p.y));if(Math.hypot(mv.x,mv.y)>.1)p.step+=dt*8}scene();boot.style.display='none';requestAnimationFrame(loop)}catch(e){boot.style.display='block';boot.style.background='#7b1919';boot.textContent='FEL: '+e.message;console.error(e)}}requestAnimationFrame(loop);function jm(e){let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-r.left-r.width/2,dy=t.clientY-r.top-r.height/2,m=Math.hypot(dx,dy)||1,nx=dx/m,ny=dy/m,d=Math.min(m,r.width*.28);nub.style.transform=`translate(${nx*d}px,${ny*d}px)`;mv={x:(nx+ny)*.72,y:(ny-nx)*.72}}joy.addEventListener('touchstart',jm,{passive:true});joy.addEventListener('touchmove',jm,{passive:true});joy.addEventListener('touchend',()=>{mv={x:0,y:0};nub.style.transform='translate(0,0)'},{passive:true});document.getElementById('bag').onclick=()=>bag=!bag;document.getElementById('light').onclick=()=>{flash=!flash;say(flash?'Ficklampa på':'Ficklampa av')};document.getElementById('act').onclick=()=>{inside=!inside;say(inside?'Du går in':'Du går ut')};window.addEventListener('error',e=>{boot.style.display='block';boot.style.background='#7b1919';boot.textContent='FEL: '+(e.message||'okänt fel')})})();</script></body></html>
