<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#18251d"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Dark Quiet — iPhone</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251d;touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:108px;height:108px;border:1px solid #aab5aa66;border-radius:50%;background:#0b100e66}.nub{position:absolute;width:42px;height:42px;left:32px;top:32px;border-radius:50%;background:#b7c0b599;border:1px solid #e7eee744}.action{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:1px solid #d4ddd388;background:#111714bb;color:#eef1ec;font:700 11px monospace}.small{position:fixed;width:52px;height:52px;border-radius:50%;border:1px solid #aeb8ae77;background:#111714bb;color:#eef1ec;font:700 10px monospace}.bag{right:max(105px,calc(env(safe-area-inset-right) + 85px));bottom:max(28px,env(safe-area-inset-bottom))}.light{right:max(27px,env(safe-area-inset-right));bottom:max(105px,calc(env(safe-area-inset-bottom) + 83px))}.rotate{display:none;position:fixed;inset:0;z-index:99;background:#18251d;color:#eee;align-items:center;justify-content:center;font:16px monospace;text-align:center}@media(orientation:portrait){.rotate{display:flex}}#status{position:fixed;left:10px;top:10px;z-index:20;color:#e6e9e2;background:#101713dd;border:1px solid #5c6b61;padding:7px 9px;font:10px monospace}@media(max-height:400px){.joy{width:92px;height:92px}.nub{left:27px;top:27px;width:36px;height:36px}.action{width:64px;height:64px}.small{width:46px;height:46px}.light{bottom:92px}}</style></head><body><canvas id="game"></canvas><div id="status">THE DARK QUIET • STARTAR…</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><button class="action" id="act">INTERAGERA</button><button class="small bag" id="bag">VÄSKA</button><button class="small light" id="light">LJUS</button><div class="rotate">Vrid iPhone till liggande läge</div><script>window.addEventListener('error',function(e){var s=document.getElementById('status');s.textContent='FEL: '+(e.message||'okänt fel');s.style.color='#ffb0a8'});(function(){var c=document.getElementById('game'),x=c.getContext('2d'),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#1b3022';x.fillRect(0,0,innerWidth,innerHeight);x.fillStyle='#29302d';x.fillRect(0,innerHeight*.48,innerWidth,70);x.fillStyle='#d8ddd7';x.font='12px monospace';x.fillText('Laddar Rosvik…',innerWidth/2-55,innerHeight/2-18)})();</script><script src="game.js?v=2" onload="document.getElementById('status').style.display='none'" onerror="document.getElementById('status').textContent='KUNDE INTE LADDA SPELET'"></script></body></html>
