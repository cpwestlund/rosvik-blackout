<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1510"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Dark Quiet — iPhone</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1510;touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.joy{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:100px;height:100px;border:1px solid #aab5aa55;border-radius:50%;background:#0b100e66}.nub{position:absolute;width:38px;height:38px;left:30px;top:30px;border-radius:50%;background:#b7c0b588;border:1px solid #e7eee744}.action{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:70px;height:70px;border-radius:50%;border:1px solid #d4ddd377;background:#111714aa;color:#eef1ec;font:700 10px monospace}.small{position:fixed;width:48px;height:48px;border-radius:50%;border:1px solid #aeb8ae66;background:#111714aa;color:#eef1ec;font:700 9px monospace}.bag{right:max(100px,calc(env(safe-area-inset-right) + 80px));bottom:max(28px,env(safe-area-inset-bottom))}.light{right:max(27px,env(safe-area-inset-right));bottom:max(100px,calc(env(safe-area-inset-bottom) + 78px))}.rotate{display:none;position:fixed;inset:0;z-index:99;background:#0b1510;color:#eee;align-items:center;justify-content:center;font:16px monospace;text-align:center}@media(orientation:portrait){.rotate{display:flex}}#status{position:fixed;left:10px;top:10px;z-index:20;color:#e6e9e2;background:#101713dd;border:1px solid #5c6b61;padding:7px 9px;font:10px monospace}@media(max-height:400px){.joy{width:88px;height:88px}.nub{left:26px;top:26px;width:34px;height:34px}.action{width:62px;height:62px}.small{width:44px;height:44px}.light{bottom:88px}}</style></head><body><canvas id="game"></canvas><div id="status">THE DARK QUIET • STARTAR…</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><button class="action" id="act">INTERAGERA</button><button class="small bag" id="bag">VÄSKA</button><button class="small light" id="light">LJUS</button><div class="rotate">Vrid iPhone till liggande läge</div><script>window.addEventListener('error',function(e){var s=document.getElementById('status');s.textContent='FEL: '+(e.message||'okänt fel');s.style.color='#ffb0a8'});</script><script src="game.js?v=3" onload="document.getElementById('status').style.display='none'" onerror="document.getElementById('status').textContent='KUNDE INTE LADDA SPELET'"></script></body></html>
