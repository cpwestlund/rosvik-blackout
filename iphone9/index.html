<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"><meta name="theme-color" content="#07100d"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>The Dark Quiet – iPhone v15</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;background:#07100d;font-family:ui-monospace,Menlo,monospace;color:#eef3ea}canvas{display:block;width:100vw;height:100vh;background:#07100d}.joy{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:114px;height:114px;border-radius:50%;border:1px solid #ffffff2c;background:#08110c55;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20}.nub{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#e8efe755;border:1px solid #ffffff3b}.btn{position:fixed;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff2e;border-radius:18px;background:#09100ddd;color:#eef2ec;font:700 11px monospace;z-index:20;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}#act{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:92px;height:74px}#bag{right:max(116px,calc(env(safe-area-inset-right) + 8px));bottom:max(16px,env(safe-area-inset-bottom));width:80px;height:54px}#light{right:max(16px,env(safe-area-inset-right));bottom:max(98px,calc(env(safe-area-inset-bottom) + 2px));width:72px;height:48px}#boot{position:fixed;left:10px;top:10px;z-index:80;padding:7px 9px;border-radius:8px;border:1px solid #d9b566;background:#8a5b19;color:white;font:11px monospace}#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 105px);transform:translateX(-50%);z-index:40;padding:8px 12px;border-radius:10px;border:1px solid #ffffff25;background:#070b0be6;color:#e8ca75;font:12px monospace;display:none;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rotate{display:none;position:fixed;inset:0;z-index:90;background:#07100d;color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;font:18px monospace}@media(orientation:portrait){.rotate{display:flex}}</style></head><body><canvas id="game"></canvas><div id="boot">LADDAR SCEN…</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><button class="btn" id="light">LJUS</button><button class="btn" id="bag">VÄSKA</button><button class="btn" id="act">INTERAGERA</button><div id="msg"></div><div class="rotate">Vrid iPhone till liggande läge</div><script>(()=>{'use strict';const C=document.getElementById('game'),g=C.getContext('2d'),boot=document.getElementById('boot'),msg=document.getElementById('msg'),joy=document.getElementById('joy'),nub=document.getElementById('nub');let W=0,H=0,D=1,raf=0,last=0,paused=false,bag=false,flash=true,scene='outside';const move={x:0,y:0},p={x:560,y:500,speed:128},state={day:1,time:22.8,hp:100,hunger:74,thirst:67,wet:24,stam:86};const bg=new Image(),hero=new Image();bg.src='scene.jpg?v=15';hero.src='player.png?v=15';const loot=[{x:430,y:455,n:'Bandage',t:'med',a:0},{x:550,y:465,n:'Bräckjärn',t:'bar',a:0},{x:760,y:500,n:'Batterier',t:'bat',a:0}],inv=['Ficklampa','Vattenflaska'];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function fit(){const s=Math.max(W/1100,H/700),w=1100*s,h=700*s;return{x:(W-w)/2,y:(H-h)/2,w,h,s}}function ws(x,y){const f=fit();return{x:f.x+x/1100*f.w,y:f.y+y/700*f.h}}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}function toast(t){msg.textContent=t;msg.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>msg.style.display='none',1600)}function rr(x,y,w,h,r,c,s){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);if(c){g.fillStyle=c;g.fill()}if(s){g.strokeStyle=s;g.stroke()}}function bar(n,v,y,c){g.fillStyle='#eef2e9';g.font='10px monospace';g.fillText(n,25,y);g.fillStyle='#0008';g.fillRect(82,y-7,58,7);g.fillStyle=c;g.fillRect(83,y-6,Math.max(0,v)*.56,5)}function hud(){rr(14,14,140,114,12,'#07100caa','#ffffff20');bar('HÄLSA',state.hp,31,'#b85c58');bar('HUNGER',state.hunger,52,'#c5a25b');bar('TÖRST',state.thirst,73,'#79a4bb');bar('UTHÅLL.',state.stam,94,'#78b184');g.fillStyle='#eef2e9';g.fillText('BLÖT '+Math.round(state.wet)+'%',25,116);rr(W-151,14,137,50,12,'#07100caa','#ffffff20');g.fillText('DAG '+state.day+'  '+clock(),W-139,34);g.fillText(scene==='outside'?'REGN  7°C':'INNE',W-139,51)}function clock(){let h=Math.floor(state.time)%24,m=Math.floor((state.time%1)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function icon(t,x,y){if(t==='med'){g.fillStyle='#933b3c';g.fillRect(x-8,y-8,16,16);g.fillStyle='#f3eee8';g.fillRect(x-2,y-6,4,12);g.fillRect(x-6,y-2,12,4)}else if(t==='bar'){g.strokeStyle='#845a3d';g.lineWidth=4;g.beginPath();g.moveTo(x-8,y+9);g.lineTo(x+8,y-9);g.stroke()}else if(t==='bat'){g.fillStyle='#d0ad55';g.fillRect(x-6,y-12,12,22);g.fillStyle='#444';g.fillRect(x-6,y-12,12,5)}else{g.fillStyle='#aaa';g.fillRect(x-7,y-7,14,14)}}function prompt(t,x,y){g.font='10px monospace';let w=g.measureText(t).width+14;rr(x-w/2,y-14,w,18,8,'#07100ce8','#ffffff20');g.fillStyle='#e8ca75';g.fillText(t,x-w/2+7,y-2)}function rain(){let t=performance.now()*.22;g.strokeStyle='#d6e1e055';g.lineWidth=1;for(let i=0;i<Math.floor(W*H/16000);i++){let x=(i*97+t)%W,y=(i*53+t*1.7)%H;g.beginPath();g.moveTo(x,y);g.lineTo(x-7,y+18);g.stroke()}}function outside(){let f=fit();g.drawImage(bg,f.x,f.y,f.w,f.h);g.fillStyle='#02080818';g.fillRect(0,0,W,H);for(const l of loot){if(l.a)continue;let q=ws(l.x,l.y);g.fillStyle='#0007';g.beginPath();g.arc(q.x,q.y+7,13,0,Math.PI*2);g.fill();icon(l.t,q.x,q.y);if(dist(p.x,p.y,l.x,l.y)<48)prompt('E '+l.n.toUpperCase(),q.x,q.y-24)}const doors=[{x:250,y:300,n:'ROSVIKSSKOLAN',to:'school'},{x:785,y:285,n:'IDROTTSHALL',to:'gym'}];for(const d of doors){let q=ws(d.x,d.y);if(dist(p.x,p.y,d.x,d.y)<72)prompt('E GÅ IN',q.x,q.y-24)}let q=ws(p.x,p.y);g.save();g.shadowColor='#000b';g.shadowBlur=10;g.shadowOffsetY=7;g.drawImage(hero,q.x-22,q.y-65,44,78);g.restore();if(flash){g.save();g.globalCompositeOperation='screen';let z=g.createRadialGradient(q.x+36,q.y-14,8,q.x+36,q.y-14,115);z.addColorStop(0,'#ffe6a033');z.addColorStop(1,'#ffe6a000');g.fillStyle=z;g.beginPath();g.moveTo(q.x,q.y-10);g.lineTo(q.x+150,q.y-78);g.lineTo(q.x+160,q.y+45);g.closePath();g.fill();g.restore()}rain()}function interior(){g.fillStyle=scene==='school'?'#201b18':'#181c1c';g.fillRect(0,0,W,H);for(let y=80;y<H-70;y+=28){g.fillStyle=(y/28)%2?'#65513e':'#715b45';g.fillRect(60,y,W-120,28)}rr(70,82,W-140,H-160,18,'#00000012','#ffffff10');if(scene==='school'){rr(105,120,210,54,10,'#604a39');rr(350,120,130,54,10,'#4c5a53');rr(W-285,110,155,210,12,'#50585d');rr(125,300,210,90,12,'#51443a');rr(370,300,150,90,12,'#493e35')}else{g.strokeStyle='#d9c88d55';g.lineWidth=2;g.strokeRect(125,125,W-250,H-250);g.beginPath();g.arc(W/2,H/2-10,62,0,Math.PI*2);g.stroke();for(let i=0;i<3;i++)rr(W-300,165+i*42,170,28,8,['#856339','#795832','#694d2b'][i])}rr(W/2-45,H-125,90,72,12,'#6d655c','#ffffff18');if(dist(p.x,p.y,W/2,H-89)<72)prompt('E GÅ UT',W/2,H-136);g.drawImage(hero,p.x-22,p.y-65,44,78);if(flash){g.save();g.globalCompositeOperation='screen';let z=g.createRadialGradient(p.x+35,p.y-12,8,p.x+35,p.y-12,105);z.addColorStop(0,'#ffe5a02a');z.addColorStop(1,'#ffe5a000');g.fillStyle=z;g.fillRect(p.x-10,p.y-100,175,180);g.restore()}}function invDraw(){let pw=Math.min(W*.72,500),ph=Math.min(H*.64,310),px=(W-pw)/2,py=(H-ph)/2;rr(px,py,pw,ph,18,'#07100cf2','#ffffff25');g.fillStyle='#eef2e9';g.font='18px monospace';g.fillText('RYGGSÄCK',px+18,py+28);let items=[...inv,...loot.filter(x=>x.a).map(x=>x.n)];items.forEach((it,i)=>{let x=px+18+(i%4)*88,y=py+52+Math.floor(i/4)*88;rr(x,y,76,76,10,'#121817','#ffffff18');g.fillStyle='#dfe5dc';g.font='10px monospace';g.fillText(it,x+8,y+60)})}function walkOut(dx,dy,dt){let sp=p.speed,nx=p.x+dx*sp*dt,ny=p.y+dy*sp*dt;p.x=Math.max(70,Math.min(990,nx));p.y=Math.max(250,Math.min(585,ny))}function update(dt){if(!bag){if(scene==='outside')walkOut(move.x,move.y,dt);else{p.x=Math.max(90,Math.min(W-90,p.x+move.x*p.speed*dt));p.y=Math.max(110,Math.min(H-75,p.y+move.y*p.speed*dt))}}let m=Math.hypot(move.x,move.y)>.05;state.stam=Math.max(0,Math.min(100,state.stam+(m?-9:6)*dt));state.hunger=Math.max(0,state.hunger-.05*dt);state.thirst=Math.max(0,state.thirst-.07*dt);state.wet=Math.max(0,Math.min(100,state.wet+(scene==='outside'?1:-1.5)*dt));state.time+=dt*.045;if(state.time>=24){state.time-=24;state.day++}}function draw(){g.clearRect(0,0,W,H);scene==='outside'?outside():interior();hud();if(bag)invDraw()}function loop(t){if(paused)return;let dt=Math.min(.033,((t-last)||16)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}function start(){if(raf)cancelAnimationFrame(raf);paused=false;last=0;resize();raf=requestAnimationFrame(loop)}function stop(){paused=true;if(raf)cancelAnimationFrame(raf);raf=0}function interact(){const l=loot.find(x=>!x.a&&dist(p.x,p.y,x.x,x.y)<50&&scene==='outside');if(l){l.a=1;inv.push(l.n);toast('Plockade upp '+l.n);return}if(scene==='outside'){if(dist(p.x,p.y,250,300)<72){scene='school';p.x=250;p.y=430;toast('Du går in i skolan');return}if(dist(p.x,p.y,785,285)<72){scene='gym';p.x=270;p.y=430;toast('Du går in i idrottshallen');return}toast('Inget att interagera med här')}else if(dist(p.x,p.y,W/2,H-89)<72){scene='outside';if(scene==='school'){p.x=250;p.y=340}else{p.x=785;p.y=330};toast('Du går ut')}else toast('Inget här')}function assetStart(){let n=0;const ok=()=>{n++;if(n===2){boot.textContent='OK • SPELET ÄR IGÅNG';boot.style.background='#1f6d42';setTimeout(()=>boot.style.display='none',1100);start()}};const fail=()=>{boot.textContent='FEL: KUNDE INTE LADDA GRAFIK';boot.style.background='#7b1919'};bg.onload=ok;hero.onload=ok;bg.onerror=fail;hero.onerror=fail;if(bg.complete&&bg.naturalWidth)ok();if(hero.complete&&hero.naturalWidth)ok()}function jm(e){let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-r.left-r.width/2,dy=t.clientY-r.top-r.height/2,m=Math.hypot(dx,dy)||1,nx=dx/m,ny=dy/m,d=Math.min(m,r.width*.28);nub.style.transform=`translate(${nx*d}px,${ny*d}px)`;move.x=nx;move.y=ny}joy.addEventListener('touchstart',jm,{passive:true});joy.addEventListener('touchmove',jm,{passive:true});joy.addEventListener('touchend',()=>{move.x=0;move.y=0;nub.style.transform='translate(0,0)'},{passive:true});document.getElementById('bag').onclick=()=>bag=!bag;document.getElementById('light').onclick=()=>{flash=!flash;toast(flash?'Ficklampa på':'Ficklampa av')};document.getElementById('act').onclick=interact;addEventListener('visibilitychange',()=>document.hidden?stop():start());addEventListener('pagehide',stop);addEventListener('pageshow',()=>setTimeout(start,40));window.onerror=m=>{boot.style.display='block';boot.style.background='#7b1919';boot.textContent='FEL: '+m};assetStart()})();</script></body></html>
