<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1"><meta name="theme-color" content="#08110d"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>The Dark Quiet – iPhone v16</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;background:#08110d;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#eef2ea}canvas{display:block;width:100vw;height:100vh;background:#08110d}#rotate{display:none;position:fixed;inset:0;z-index:40;background:#08110d;color:#eef2ea;align-items:center;justify-content:center;text-align:center;padding:24px;font:18px/1.45 monospace}@media (orientation:portrait){#rotate{display:flex}}#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 106px);transform:translateX(-50%);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(7,10,10,.88);color:#e7ca76;font:12px monospace;display:none;z-index:32;max-width:76vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.joy{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(10,14,14,.33);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:22}.nub{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:rgba(231,238,233,.34);border:1px solid rgba(255,255,255,.22)}.btn{position:fixed;display:flex;align-items:center;justify-content:center;text-align:center;color:#eef2ea;border:1px solid rgba(255,255,255,.18);background:rgba(9,12,12,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:18px;font:700 11px/1.1 monospace;z-index:22}#act{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:94px;height:76px}#bag{right:max(116px,calc(env(safe-area-inset-right) + 8px));bottom:max(16px,env(safe-area-inset-bottom));width:80px;height:54px}#light{right:max(16px,env(safe-area-inset-right));bottom:max(98px,calc(env(safe-area-inset-bottom) + 4px));width:72px;height:48px}#run{right:max(98px,calc(env(safe-area-inset-right) + 20px));bottom:max(98px,calc(env(safe-area-inset-bottom) + 4px));width:72px;height:48px}#boot{position:fixed;left:10px;top:10px;z-index:90;padding:7px 9px;border:1px solid #d9b566;border-radius:8px;background:#8a5b19;color:#fff;font:11px monospace}</style></head><body><canvas id="game"></canvas><div id="boot">HTML OK • STARTAR SPELET…</div><div id="rotate">Vrid telefonen till liggande läge.</div><div class="joy" id="joy"><div class="nub" id="nub"></div></div><div class="btn" id="light">LJUS</div><div class="btn" id="run">SPRING</div><div class="btn" id="bag">VÄSKA</div><div class="btn" id="act">INTERA-<br>GERA</div><div id="msg"></div><script>window.addEventListener('error',function(e){var b=document.getElementById('boot');if(b){b.style.display='block';b.style.background='#7a1d1d';b.textContent='FEL: '+(e.message||'okänt fel');}});</script><script src="game.js?v=16" onload="setTimeout(function(){var b=document.getElementById('boot');if(b)b.style.display='none'},800)" onerror="document.getElementById('boot').textContent='FEL: game.js laddades inte';document.getElementById('boot').style.background='#7a1d1d'"></script></body></html>
